{% extends "layout.html" %}
{% block content %}

<h2>Update Student</h2>

{% for message in get_flashed_messages() %}
<p>{{message}}</p>
{% endfor %}

<form method="POST">

    <div class="form-group">
        <label>Name</label>
        <input type="text" name="name" value="{{student[1]}}" maxlength="50" required>
    </div>

    <div class="form-group">
        <label>Roll Number</label>
        <input type="text" name="roll_no" value="{{student[2]}}" maxlength="10" required>
    </div>

    <div class="form-group">
        <label>Branch</label>
        <select name="branch" required>
            <option value="CSE" {% if student[3]=="CSE" %}selected{% endif %}>CSE</option>
            <option value="ECE" {% if student[3]=="ECE" %}selected{% endif %}>ECE</option>
            <option value="EEE" {% if student[3]=="EEE" %}selected{% endif %}>EEE</option>
            <option value="MECH" {% if student[3]=="MECH" %}selected{% endif %}>MECH</option>
            <option value="CIVIL" {% if student[3]=="CIVIL" %}selected{% endif %}>CIVIL</option>
            <option value="AI&DS" {% if student[3]=="AI&DS" %}selected{% endif %}>AI&DS</option>
        </select>
    </div>

    <div class="form-group">
        <label>CGPA</label>
        <input type="number" name="cgpa" min="0" max="10" step="0.01" value="{{student[4]}}" required>
    </div>

    <div class="form-action">
        <button type="submit">Update Student</button>
        <a href="{{url_for('view')}}"><button type="button">Cancel</button></a>
    </div>

</form>

{% endblock %}
